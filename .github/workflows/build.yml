name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Vulkan SDK used by the Windows jobs and for the Linux validation layer (bump to update; cached per version)
  VULKAN_SDK_VERSION: 1.4.363.0

jobs:
  linux:
    name: Linux (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev glslc libglfw3-dev libglm-dev

      # Lavapipe (Mesa's CPU Vulkan driver) and a virtual X display for the run step
      - name: Install runtime test dependencies
        if: matrix.config == 'Debug'
        run: sudo apt-get install -y mesa-vulkan-drivers xvfb

      # Ubuntu's packaged validation layer is too old for synchronization validation (needs 1.3.280+),
      # so the run step uses the layer from the LunarG SDK instead
      - name: Cache validation layer
        if: matrix.config == 'Debug'
        id: layer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/vulkan-validation-layer
          key: vulkan-validation-layer-linux-${{ env.VULKAN_SDK_VERSION }}

      - name: Download validation layer
        if: matrix.config == 'Debug' && steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p ~/vulkan-validation-layer
          # Stream the SDK archive and extract only the layer library and its manifest
          curl -fsSL "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkan_sdk.tar.xz" \
            | tar -xJ -C ~/vulkan-validation-layer --wildcards \
              '*/x86_64/lib/libVkLayer_khronos_validation.so' \
              '*/x86_64/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json'
          # Debug symbols make up most of the library's size; dropping them keeps the cache small
          strip --strip-debug ~/vulkan-validation-layer/$VULKAN_SDK_VERSION/x86_64/lib/libVkLayer_khronos_validation.so

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build

      # The executable is named after project() in CMakeLists.txt, read back from the CMake cache
      - name: Check outputs
        run: |
          name=$(sed -n 's/^CMAKE_PROJECT_NAME:STATIC=//p' build/CMakeCache.txt)
          test -n "$name" || { echo "CMAKE_PROJECT_NAME not found in build/CMakeCache.txt"; exit 1; }
          test -x "build/$name" && test -f build/shaders/vert.spv && test -f build/shaders/frag.spv
          echo "APP_NAME=$name" >> "$GITHUB_ENV"

      # Renders a few hundred frames with validation and synchronization validation (Debug builds);
      # the app exits with an error on any validation error, crash or failed Vulkan call
      - name: Run with validation on lavapipe
        if: matrix.config == 'Debug'
        timeout-minutes: 5
        run: |
          # Mesa 25+ installs lvp_icd.json; older releases used lvp_icd.<arch>.json
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n 1)
          test -n "$icd" || { echo "lavapipe ICD not found; available:"; ls /usr/share/vulkan/icd.d; exit 1; }
          layers=~/vulkan-validation-layer/$VULKAN_SDK_VERSION/x86_64/share/vulkan/explicit_layer.d
          test -f "$layers/VkLayer_khronos_validation.json" || { echo "Validation layer not found in $layers"; exit 1; }
          VK_DRIVER_FILES="$icd" VK_LAYER_PATH="$layers" \
            xvfb-run -a -s "-screen 0 1280x720x24" "build/$APP_NAME" --frames 300

  windows:
    name: Windows (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-windows-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan_sdk.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkan_sdk.exe
          $process = Start-Process -FilePath .\vulkan_sdk.exe -Wait -PassThru -NoNewWindow -ArgumentList `
            "--root", $root, "--accept-licenses", "--default-answer", "--confirm-command", "install"
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK installer failed with exit code $($process.ExitCode)" }

      - name: Set up Vulkan SDK environment
        shell: pwsh
        run: |
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          if (-not (Test-Path "$root\Bin\glslc.exe")) { throw "glslc.exe not found in $root\Bin" }
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          "$root\Bin" >> $env:GITHUB_PATH

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      # The executable is named after project() in CMakeLists.txt, read back from the CMake cache
      - name: Check outputs
        shell: pwsh
        run: |
          $match = Select-String -Path build\CMakeCache.txt -Pattern '^CMAKE_PROJECT_NAME:STATIC=(.+)$'
          if (-not $match) { throw "CMAKE_PROJECT_NAME not found in build\CMakeCache.txt" }
          $name = $match.Matches[0].Groups[1].Value
          foreach ($file in "build\$name.exe", "build\shaders\vert.spv", "build\shaders\frag.spv") {
            if (-not (Test-Path $file)) { throw "Missing build output: $file" }
          }
